name: schedule-posts

# Free draft scheduler — publishes posts/*.md with draft:true when date <= today IST
# No $ — runs on GitHub Actions free minutes (Ubuntu, Node 20). Keeps Lab Notebook No.01 build intact.

on:
  schedule:
    - cron: "17 0 * * *"   # daily 05:47 IST (00:17 UTC) — off :00/:30 to avoid fleet thunder
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish due drafts (IST date)
        run: |
          node -e '
          const fs=require("fs"), path=require("path");
          const dir="posts";
          const today = new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"}); // YYYY-MM-DD IST
          console.log("IST today:", today);
          let changed=false;
          for(const f of fs.readdirSync(dir)){
            if(!f.endsWith(".md")||f==="README.md") continue;
            const p=path.join(dir,f);
            let raw=fs.readFileSync(p,"utf8");
            if(!raw.startsWith("---")) continue;
            const end=raw.indexOf("\n---",3);
            if(end===-1) continue;
            const fm=raw.slice(0,end+4);
            const hasDraft=/^\s*draft:\s*true\s*$/m.test(fm);
            const m=fm.match(/^\s*date:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/m);
            const d=m?m[1]:null;
            if(hasDraft && d && d<=today){
              console.log(`publish ${f}: draft:true + date ${d} <= ${today} → flipping to draft:false`);
              raw=raw.replace(/^\s*draft:\s*true\s*$/m,"draft: false");
              fs.writeFileSync(p, raw);
              changed=true;
            } else if(hasDraft){
              console.log(`keep draft ${f}: date ${d} > ${today}`);
            }
          }
          if(!changed) console.log("no drafts due");
          // signal to next step
          fs.writeFileSync("/tmp/changed", changed?"1":"0");
          '
      - name: Rebuild blog (posts.json + feed + og + sitemap)
        run: node scripts/generate-blog.js
      - name: Commit & push if changed
        run: |
          if [ "$(cat /tmp/changed)" != "1" ] && git diff --quiet && git diff --cached --quiet; then
            echo "nothing to publish";
            exit 0;
          fi
          if git diff --quiet && git diff --cached --quiet; then
            echo "rebuild only, no draft flip — skip push (Pages workflow will rebuild anyway)";
            exit 0;
          fi
          git config user.name "hariomlohardev-bot"
          git config user.email "bot@hariomlohardev.github.io"
          git add posts/*.md posts.json feed.xml sitemap.xml blog/p og || true
          git commit -m "chore: publish due drafts $(date -u +%Y-%m-%d) [skip ci]" || echo "no commit"
          git push || echo "push failed — check branch protection"
