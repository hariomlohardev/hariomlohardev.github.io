name: Auto-tweet daily log

on:
  push:
    branches: [main]
    paths:
      - "scripts/tweet-daily-log.js"
      - ".github/workflows/tweet-daily-log.yml"
  workflow_dispatch:
    inputs:
      slug:
        description: "Post slug to tweet (empty = latest)"
        required: false
        type: string
      dry_run:
        description: "Dry run (log only, don't post)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force:
        description: "Force tweet even if .last-tweeted matches"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pick the post to tweet
        id: changed
        run: |
          # Supabase holds the posts; only a manual slug narrows it down,
          # otherwise the tweet script takes the latest published post.
          echo "slug=${{ inputs.slug }}" >> $GITHUB_OUTPUT
      - name: Tweet daily log
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_API_KEY_ALT: ${{ secrets.X_API_KEY_ALT }}
          X_API_SECRET_ALT: ${{ secrets.X_API_SECRET_ALT }}
          X_ACCESS_TOKEN_ALT: ${{ secrets.X_ACCESS_TOKEN_ALT }}
          X_ACCESS_SECRET_ALT: ${{ secrets.X_ACCESS_SECRET_ALT }}
          CHANGED_SLUG: ${{ steps.changed.outputs.slug }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
          FORCE_TWEET: ${{ inputs.force == 'true' && '1' || '' }}
        run: node scripts/tweet-daily-log.js
