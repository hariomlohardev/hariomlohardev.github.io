name: Auto-tweet daily log

on:
  push:
    branches: [main]
    paths:
      - "posts/*.md"
      - "posts.json"
      - "scripts/tweet-daily-log.js"
      - ".github/workflows/tweet-daily-log.yml"
  workflow_dispatch:
    inputs:
      slug:
        description: "Post slug to tweet (empty = latest)"
        required: false
        type: string
      dry_run:
        description: "Dry run (log only, don't post)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force:
        description: "Force tweet even if .last-tweeted matches"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build posts.json (ensure fresh)
        run: node scripts/generate-blog.js
      - name: Detect changed post
        id: changed
        run: |
          # Prefer manual slug input, else detect changed posts/*.md in this push
          if [ -n "${{ inputs.slug }}" ]; then
            echo "slug=${{ inputs.slug }}" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
            exit 0
          fi
          FILES=$(git diff --name-only HEAD~1 HEAD -- posts/*.md 2>/dev/null | tr '\n' ' ' || echo "")
          echo "files=$FILES" >> $GITHUB_OUTPUT
          # extract slug from first changed md if any
          SLUG=""
          for f in $FILES; do
            if [ -f "$f" ]; then
              # try slug: field, else filename
              SLUG=$(grep -m1 "^slug:" "$f" | sed -E 's/^slug:\s*["'\'']?([^"'\'']+)["'\'']?.*/\1/' | tr -d ' ' || echo "")
              if [ -z "$SLUG" ]; then
                base=$(basename "$f" .md)
                SLUG=$(echo "$base" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
              fi
              break
            fi
          done
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "Detected files: $FILES slug: $SLUG"
      - name: Tweet daily log
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_API_KEY_ALT: ${{ secrets.X_API_KEY_ALT }}
          X_API_SECRET_ALT: ${{ secrets.X_API_SECRET_ALT }}
          X_ACCESS_TOKEN_ALT: ${{ secrets.X_ACCESS_TOKEN_ALT }}
          X_ACCESS_SECRET_ALT: ${{ secrets.X_ACCESS_SECRET_ALT }}
          CHANGED_SLUG: ${{ steps.changed.outputs.slug }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
          FORCE_TWEET: ${{ inputs.force == 'true' && '1' || '' }}
        run: node scripts/tweet-daily-log.js
