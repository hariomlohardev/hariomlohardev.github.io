name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # /admin writes Supabase only — this is how a publish reaches the static build
  repository_dispatch:
    types: [content-changed]
  # backstop for when the ping cannot be sent (no GITHUB_TOKEN on Vercel, API down)
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build blog from Supabase (feed.xml / blog/p pages / og)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-blog.js
      - name: Build project detail pages (projects-data → projects/p/*/index.html)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-projects.js
      - name: Build LLM index (llms.txt / llms-full.txt)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-llms.js
      - name: Build open-source snapshot (GitHub API → opensource-data.json + sitemap)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-opensource.js
      - name: Build tricks (Supabase/tricks-data → tricks/p/*/index.html + sitemap)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-tricks.js
      - name: Keep /admin and /api off Pages (both need Vercel's functions)
        run: rm -rf admin api
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
