name: Deploy via Vercel (preview + production) — keeps Pages in sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    runs-on: ubuntu-latest
    # Only run if Vercel secrets are set — otherwise the job just no-ops with a friendly log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        # no package-lock yet is fine; cache will miss first run

      - name: Install (zero deps, safe no-op)
        run: npm install --silent || echo "no deps — ok"

      - name: Build — same as Pages (blog → projects → llms → opensource)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Vercel secrets present
        id: has_vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "present=false" >> $GITHUB_OUTPUT
            echo "⚠️ Vercel secrets not set — skipping Vercel deploy (Pages still deploys via pages.yml)."
            echo "   To enable: Vercel dashboard → Project → Settings → Environment Variables → add VERCEL_TOKEN (from vercel token), then"
            echo "   Vercel → Settings → General → Project ID / Org ID → add as VERCEL_PROJECT_ID / VERCEL_ORG_ID secrets in GitHub → Settings → Secrets and variables → Actions."
          else
            echo "present=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        if: steps.has_vercel.outputs.present == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: ./
          vercel-args: ${{ github.event_name == 'pull_request' && '--prebuilt' || '--prod --prebuilt' }}

      - name: Comment PR with Preview URL
        if: steps.has_vercel.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${{ secrets.VERCEL_PROJECT_ID }}.vercel.app`; // Vercel also comments automatically via its GitHub App if installed
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔍 Vercel Preview — build succeeded (same output as Pages). Check Vercel dashboard for the preview URL.`
            }).catch(()=>{});
