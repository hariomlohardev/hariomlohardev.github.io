<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<script>/* /admin needs /api, which exists only on Vercel — bounce the Pages host */(function(){if(location.hostname==="hariomlohardev.github.io"){location.replace("https://hariomlohardev.vercel.app"+location.pathname+location.search+location.hash);}})();</script>
<title>Admin — Blog · Hariom Lab</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script>document.documentElement.classList.add('js')</script>
<link rel="preload" href="/assets/fonts/archivo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css?v=1">
<style>
:root{--paper:#F6F4EE;--paper-2:#EFECE2;--sheet:#FBFAF6;--ink:#181611;--muted:#5F594A;--line:#DAD5C6;--accent:#B93A13;--green:#1E7A4E;--max:1100px;--pad:clamp(18px,4vw,48px);--mono:'Space Mono',monospace;--serif:'Fraunces',serif;--sans:'Archivo',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:#3B382E}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
header{position:sticky;top:0;background:rgba(246,244,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10}
.head-main{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none}
.logo b{color:var(--ink)}
.box{background:var(--sheet);border:1px solid var(--ink);padding:18px}
.btn{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;border:1px solid var(--ink);padding:12px 18px;display:inline-flex;gap:8px;align-items:center;min-height:44px;transition:.2s;cursor:pointer;text-decoration:none}
.btn.solid{background:var(--ink);color:#F6F4EE}
.btn.solid:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:var(--sheet);color:var(--ink)}
.btn.ghost:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(24,22,17,.06)}
.input{width:100%;font-family:var(--sans);font-size:14px;padding:11px 13px;border:1px solid var(--line);background:#fff;outline:none}
.input:focus{border-color:var(--accent)}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:7px 12px;background:var(--paper);cursor:pointer;transition:.15s}
.pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill:hover{border-color:var(--ink)}
.post-card{border:1px solid var(--ink);background:var(--sheet);padding:16px;display:grid;gap:10px;position:relative;transition:transform .15s, box-shadow .15s}
.post-card:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(24,22,17,.07)}
.post-card.draft{border-style:dashed;opacity:.9}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:4px 8px;display:inline-block}
.badge.pub{background:var(--green);color:#fff;border-color:var(--green)}
.badge.draft{background:var(--paper);color:var(--muted)}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.stat{background:var(--sheet);border:1px solid var(--ink);padding:14px 14px;display:grid;gap:6px}
.stat b{font-family:var(--serif);font-weight:600;font-size:1.4rem;line-height:1}
.stat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media(max-width:860px){ .stats{grid-template-columns:1fr 1fr} .toolbar{grid-template-columns:1fr !important} .post-actions{flex-wrap:wrap} }
.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:16px}
@media(max-width:640px){ .toolbar{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="wrap head-main">
    <a class="logo" href="/admin/">← <b>Admin</b> · Blog</a>
    <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">Supabase <code>posts</code> · live</span>
  </div>
</header>

<main class="wrap" style="padding:28px 0 40px">
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end;justify-content:space-between">
    <div>
      <h1 style="font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,4vw,2.3rem);color:var(--ink)">Blog</h1>
      <p style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px">Daily logs & articles — Supabase is source of truth. Create in editor with live MD preview.</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn ghost" href="/blog" target="_blank">View Blog ↗</a>
      <a class="btn solid" href="/admin/blog/edit.html">+ New post →</a>
    </div>
  </div>

  <div id="gate" class="box" style="display:none;margin-top:16px">
    <p style="font-family:var(--mono);font-size:12px;color:var(--muted)">Not logged in → <a href="/admin/" style="color:var(--accent);text-decoration:underline">login</a></p>
  </div>

  <div id="app" style="display:none">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input id="q" class="input" placeholder="Search title, slug, description, tags…" />
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="published">Published</button>
        <button class="pill" data-filter="draft">Drafts</button>
        <button class="pill" data-filter="daily-log">Daily logs</button>
      </div>
    </div>

    <div id="list" style="margin-top:16px;display:grid;gap:12px"></div>
    <div id="empty" class="box" style="display:none;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;margin-top:16px">No posts match — try another search or <a href="/admin/blog/edit.html" style="color:var(--accent);text-decoration:underline">create one</a>.</div>

    <div class="box" style="margin-top:22px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">
        <h2 style="font-family:var(--serif);font-weight:600;font-size:1.15rem;color:var(--ink)">Comments <span class="badge" id="cmUnread" style="display:none"></span></h2>
        <button class="btn ghost" id="cmSeen" style="padding:8px 12px;font-size:11px">Mark all read</button>
      </div>
      <div id="cmList" style="margin-top:12px;display:grid;gap:10px"></div>
    </div>
  </div>
</main>

<script>
function token(){ return localStorage.getItem('admin_token'); }
async function check(){ const t=token(); if(!t) return false; try{ const r=await fetch('/api/admin/verify?token='+encodeURIComponent(t)); const j=await r.json(); return j.ok; }catch{ return false; } }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let posts=[];
let comments=[];
let filter='all';
let q='';
// notification mail needs a verified sender to be reliable; this inbox needs nothing,
// so it is the one place a new comment always turns up.
const SEEN_KEY='hl_admin_comments_seen';
function fmtWhen(t){ try{ return new Date(t).toLocaleString('en-GB',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch{ return String(t||''); } }

function renderStats(){
  const total=posts.length;
  const pub=posts.filter(p=>p.published).length;
  const drafts=total-pub;
  const daily=posts.filter(p=>(p.tags||[]).includes('daily-log')).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><b>${total}</b><span>Total posts</span></div>
    <div class="stat"><b>${pub}</b><span>Published</span></div>
    <div class="stat"><b>${drafts}</b><span>Drafts</span></div>
    <div class="stat"><b>${daily}</b><span>Daily logs</span></div>`;
}

function matches(p){
  if(filter==='published' && !p.published) return false;
  if(filter==='draft' && p.published) return false;
  if(filter==='daily-log' && !(p.tags||[]).includes('daily-log')) return false;
  if(!q) return true;
  const hay=[p.title,p.slug,p.description,(p.tags||[]).join(' '),p.date].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function render(){
  const list=document.getElementById('list');
  const empty=document.getElementById('empty');
  const filtered=posts.filter(matches).sort((a,b)=> String(b.date).localeCompare(String(a.date)) );
  if(!filtered.length){
    list.innerHTML='';
    empty.style.display='block';
    return;
  }
  empty.style.display='none';
  list.innerHTML=filtered.map(p=>`
    <div class="post-card ${p.published?'':'draft'}">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
        <span class="badge ${p.published?'pub':'draft'}">${p.published?'Published':'Draft'} · ${esc(p.date||'')} · ${esc(p.reading_minutes||p.readingMinutes||3)} min · ${esc(p.word_count||p.wordCount||'—')} w</span>
        <span class="kicker">${esc((p.tags||[]).join(' · '))}</span>
      </div>
      <div style="font-family:var(--serif);font-weight:600;font-size:1.2rem;line-height:1.15;color:var(--ink)">${esc(p.title||'Untitled')}</div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--muted)">/${esc(p.slug||'')}/ · ${esc(p.description||'')}</div>
      <div class="post-actions" style="display:flex;gap:8px;margin-top:4px">
        <a class="btn ghost" href="/admin/blog/edit.html?id=${encodeURIComponent(p.id)}" style="padding:8px 12px;font-size:11px">Edit →</a>
        <a class="btn ghost" href="/blog/p/${encodeURIComponent(p.slug)}/" target="_blank" style="padding:8px 12px;font-size:11px">View ↗</a>
        <button class="btn ghost" data-del="${esc(p.id)}" style="padding:8px 12px;font-size:11px">Delete</button>
        <span style="margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);align-self:center">/${esc(p.slug||'')}/</span>
      </div>
    </div>`).join('');
}

function renderComments(){
  const wrap=document.getElementById('cmList');
  const badge=document.getElementById('cmUnread');
  if(!comments.length){
    wrap.innerHTML='<p style="font-family:var(--mono);font-size:11.5px;color:var(--muted)">No comments yet.</p>';
    badge.style.display='none';
    return;
  }
  const seen=localStorage.getItem(SEEN_KEY)||'';
  const unread=comments.filter(c=>String(c.created_at)>seen).length;
  badge.textContent=unread+' new';
  badge.style.display=unread?'inline-block':'none';
  wrap.innerHTML=comments.map(c=>{
    const fresh=String(c.created_at)>seen;
    const slug=String(c.post_slug||'');
    return `<div class="post-card"${fresh?' style="border-left:3px solid var(--accent)"':''}>
      <div class="kicker">${esc(c.author_name||'anon')} · ${esc(fmtWhen(c.created_at))}${c.parent_id?' · reply':''}</div>
      <div style="font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap">${esc(c.content||'')}</div>
      <div style="font-family:var(--mono);font-size:10.5px"><a href="/blog/p/${encodeURIComponent(slug)}/" target="_blank" style="color:var(--accent)">/${esc(slug)}/ ↗</a></div>
    </div>`;
  }).join('');
}

async function load(){
  const ok=await check();
  if(!ok){ document.getElementById('gate').style.display='block'; return; }
  document.getElementById('app').style.display='block';
  const t=token();
  const r=await fetch('/api/admin/posts?token='+encodeURIComponent(t));
  const j=await r.json();
  posts=j.posts||[];
  renderStats();
  render();
  try{
    const rc=await fetch('/api/admin/posts?type=inbox&token='+encodeURIComponent(t));
    const jc=await rc.json();
    comments=jc.comments||[];
  }catch{ comments=[]; }
  renderComments();
}

window.delPost=async function(id){
  if(!confirm('Delete this post?')) return;
  const t=token();
  const r=await fetch('/api/admin/posts', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+t}, body: JSON.stringify({action:'delete', id}) });
  const j=await r.json();
  if(!j.ok) alert(j.error||'Delete failed'); else load();
};

document.getElementById('q').addEventListener('input', e=>{ q=e.target.value.trim(); render(); });
// one delegated handler instead of an onclick per card — the id never touches markup
document.getElementById('list').addEventListener('click', e=>{
  const b=e.target.closest('[data-del]');
  if(b) delPost(b.getAttribute('data-del'));
});
document.getElementById('cmSeen').addEventListener('click', ()=>{
  if(comments.length) localStorage.setItem(SEEN_KEY, String(comments[0].created_at||''));
  renderComments();
});
document.querySelectorAll('.pill').forEach(b=> b.addEventListener('click', ()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  filter=b.dataset.filter;
  render();
}));

load();
</script>
</body>
</html>
